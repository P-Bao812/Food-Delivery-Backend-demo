name: Laravel CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  laravel-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Tải mã nguồn về máy chủ ảo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường PHP (Bạn có thể đổi phiên bản 8.2 thành 8.1 hoặc 8.3 tùy phiên bản máy bạn)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql
          coverage: none

      # 3. Tạo file môi trường .env từ bản mẫu .env.example
      - name: Prepare Environment File
        run: cp .env.example .env

      # 4. Cài đặt các gói thư viện PHP qua Composer
      - name: Install Composer Dependencies
        uses: ramsey/composer-install@v3

      # 5. Tạo App Key cho Laravel
      - name: Generate Application Key
        run: php artisan key:generate

      # 6. Chạy kiểm thử tự động (Unit Test / Feature Test)
      - name: Run Tests via Artisan
        run: php artisan test

      - name: Pipeline Status
        run: echo "Pipeline CI/CD cho Laravel chay thanh cong!"
